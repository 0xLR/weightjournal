[package]
name = "weight-journal"
version = "1.0.0"
description = "A private desktop weight journal"
authors = ["0xlr <170220762+0xLR@users.noreply.github.com>"]
edition = "2021"

[lib]
name = "weight_journal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
rfd = "0.14"
auto-launch = "0.5"
dirs = "5.0"
